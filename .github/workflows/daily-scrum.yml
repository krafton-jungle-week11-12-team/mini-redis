name: Daily Scrum

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST (UTC 23:00)
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RESULT=$(gh api graphql \
            -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategory(slug:"daily-scrum"){id}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}")
          echo "$RESULT"

          REPO_ID=$(echo "$RESULT" | jq -r '.data.repository.id')
          CAT_ID=$(echo "$RESULT" | jq -r '.data.repository.discussionCategory.id // empty')

          if [ -z "$CAT_ID" ]; then
            echo "::error::'daily-scrum' slug의 Discussion 카테고리를 찾을 수 없습니다."
            exit 1
          fi

          # DiscussionCategory에는 discussions 필드가 없으므로 repository.discussions를 categoryId로 필터링한다.
          RECENT=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$c:ID!){repository(owner:$o,name:$n){discussions(first:10,categoryId:$c,orderBy:{field:CREATED_AT,direction:DESC}){nodes{title url}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" -f c="$CAT_ID")

          # 오늘 글을 이미 누가 직접 열었으면 새로 만들지 않는다.
          TITLE="[Daily] $(TZ=Asia/Seoul date +%F)"
          EXISTING=$(echo "$RECENT" | jq -r --arg t "$TITLE" '.data.repository.discussions.nodes[] | select(.title == $t) | .url' | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "오늘 스크럼 글이 이미 있어요: $EXISTING"
            exit 0
          fi

          BODY=$(cat <<'EOF'
          오늘의 스크럼을 댓글에 작성해주세요.

          예시

          ```
          ## 어제 한 일
          - 해시 테이블 SET/GET 구현

          ## 오늘 할 일
          - 서버 요청 처리 시작

          ## 막힌 점
          - 리사이즈할 때 기존 키 재배치 방식 고민 중
          ```
          EOF
          )
          
          gh api graphql \
            -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$REPO_ID" -f c="$CAT_ID" \
            -f t="$TITLE" \
            -f b="$BODY"