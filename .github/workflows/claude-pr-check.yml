name: Claude PR Check

# PR이 열리면 closes 연결, 다른 PR과의 충돌 가능성, 머지 순서를 확인해 댓글 하나로 남긴다.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            레포지토리: ${{ github.repository }}
            PR 번호: ${{ github.event.pull_request.number }}

            아래 세 가지를 확인해 주세요.
            1. closes 확인: gh pr view로 PR 본문을 읽고 `closes #번호`(또는 fixes, resolves)가 있는지 확인해요.
            2. 충돌 확인: gh pr list --state open으로 열린 PR을 찾고, gh pr diff --name-only로 이 PR과 각 PR의 바뀐 파일을 비교해요. 같은 파일을 바꾼 PR이 있으면 PR 번호와 파일을 적어요. gh pr view --json mergeable로 main과 충돌하는지도 확인해요.
            3. 머지 순서 추천: 2번 결과와 연결된 이슈의 단계(요구사항 → 설계 → 테스트 → 구현)를 보고 열린 PR들의 머지 순서를 제안해요. 순서가 상관없으면 그렇다고 한 줄만 써요.

            결과는 gh pr comment로 댓글 하나만 남겨요. 한국어로 짧게, 항목마다 1~3줄로 써요.
          claude_args: |
            --max-turns 15
            --allowedTools "Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
