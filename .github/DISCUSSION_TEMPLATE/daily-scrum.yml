title: "[Daily] YYYY-MM-DD"
body:
  - type: markdown
    attributes:
      value: |
        오늘의 스크럼 글이에요. 각자 아래 형식으로 **댓글**에 작성해 주세요.

        ```
        ## 어제 한 일
        - 해시 테이블 SET/GET 구현

        ## 오늘 할 일
        - 서버 요청 처리 시작

        ## 막힌 점
        - 리사이즈할 때 기존 키 재배치 방식 고민 중
        ```
  - type: textarea
    id: notice
    attributes:
      label: 오늘 공지
      description: 오늘 함께 알아야 할 일정이나 공지가 있으면 적어요. 없으면 비워 둬요.
